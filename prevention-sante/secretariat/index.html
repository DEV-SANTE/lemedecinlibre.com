<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Secrétariat — Prévention Santé</title>
<link rel="stylesheet" href="../commun/charte.css?v=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bandeau{background:var(--amber-bg);border-bottom:1px solid var(--amber-line);color:#6b4708;
  padding:9px 22px;font-size:12.5px}
.bandeau b{color:#5a3c06}
.tete{display:flex;align-items:center;gap:11px;padding:16px 22px;background:#fff;
  border-bottom:1px solid var(--line)}
.tete img{width:32px;height:32px;flex:0 0 32px;display:block}
.tete b{font-size:15px}
.tete span{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.tete .qui{margin-left:auto;font-size:12.5px;color:var(--ink-3);text-align:right}
.tete button{margin-left:14px;font:inherit;font-size:12.5px;color:var(--pri);background:none;
  border:0;cursor:pointer}
nav{display:flex;gap:3px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);
  overflow-x:auto}
nav button{padding:11px 15px;font:inherit;font-size:13.5px;color:var(--ink-3);background:none;
  border:0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:26px 22px 60px}
h1{font-size:20px;letter-spacing:-.02em;margin:0 0 6px}
.sous{margin:0 0 20px;font-size:13.5px;color:var(--ink-3);max-width:72ch}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;font-size:13.5px}
th{text-align:left;padding:10px 13px;background:var(--bg);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-4);font-weight:600;border-bottom:1px solid var(--line)}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.vide{padding:26px 13px;color:var(--ink-4);font-size:13.5px;text-align:center}
.btn{font:inherit;font-size:13px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}
.btn-p{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn:disabled{opacity:.55;cursor:progress}
.carte{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;
  max-width:560px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:13px 0 5px}
input,select{width:100%;padding:9px 11px;font:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:8px;background:#fff}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{margin-top:15px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.55;display:none}
.msg.erreur{display:block;background:#fdf2f2;border:1px solid #f5c6c6;color:#8a2020}
.msg.ok{display:block;background:var(--fait-l);border:1px solid var(--fait-ln);color:#0f5828}
.pastille{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600}
.p-brouillon{background:var(--bg);color:var(--ink-3);border:1px solid var(--line)}
.p-transmis{background:#eaf2fb;color:#1a5695;border:1px solid #c3d9f0}
.p-relu{background:var(--fait-l);color:#0f5828;border:1px solid var(--fait-ln)}
.mur{margin-top:22px;padding:14px 16px;background:var(--bg);border:1px solid var(--line);
  border-left:3px solid var(--ink-4);border-radius:9px;font-size:12.5px;color:var(--ink-3);
  line-height:1.6;max-width:76ch}
.mur b{color:var(--ink-2)}
.aide{font-size:12px;color:var(--ink-4);margin-top:5px}
</style>
</head>
<body>

<div class="bandeau"><b>Environnement de test — patients fictifs uniquement.</b>
Aucune donnée réelle ne doit être saisie ici.</div>

<div class="tete">
  <img src="../commun/marque.svg" alt="">
  <div><b>Prévention Santé</b><span>Secrétariat</span></div>
  <div class="qui" id="qui"></div>
  <button id="b-sortir">Se déconnecter</button>
</div>

<nav>
  <button data-vue="attente" aria-current="true">À rattacher</button>
  <button data-vue="patients">Patients du centre</button>
  <button data-vue="nouveau">Nouveau patient</button>
  <button data-vue="resultats">Saisir des résultats</button>
  <button data-vue="agenda">Créneaux et rendez-vous</button>
  <button data-vue="documents">Documents</button>
  <button data-vue="securite">Ma sécurité</button>
</nav>

<main id="app"></main>

<script src="../commun/api-client.js?v=1"></script>
<script src="../commun/adaptateur.js?v=1"></script>
<script src="../plateforme/biologie.js?v=1"></script>
<script src="secretariat.js?v=1"></script>
</body>
</html>
