# =====================================================================
#  Prévention Santé — maquette de démonstration
#  Serveur AZNETWORK (hébergement HDS)
#
#  CE QUI A CHANGÉ DEPUIS LA PREMIÈRE VERSION DE CE FICHIER
#  La première version décrivait un site purement statique, sans base de
#  données : c'était vrai de la maquette. Ce n'est plus le cas. La
#  plateforme comporte désormais un serveur applicatif Node et une base
#  PostgreSQL, et elle traite de vraies données de santé.
#
#  Ce fichier a donc été corrigé : nginx sert le site ET relaie /api/
#  vers le serveur applicatif. Installer l'ancienne version reviendrait à
#  déployer la maquette en croyant déployer la plateforme.
#
#  NATURE DU SERVICE
#  - Fichiers statiques : servis directement par nginx.
#  - /api/ : relayé vers le service prevention-sante (port 3000).
#  - Base PostgreSQL : accès local uniquement, jamais exposée.
#  - Le serveur applicatif n'écoute PAS en HTTPS : c'est nginx qui termine
#    TLS. Le service ne doit donc être joignable que depuis la machine.
#
#  POURQUOI L'ACCÈS EST RESTREINT
#  Cette maquette n'est pas le service. L'analyse d'impact (AIPD) n'est
#  pas terminée et le socle applicatif n'existe pas encore. Elle doit
#  donc rester inaccessible au public et non indexable, pour qu'aucun
#  patient ne la prenne pour le service réel et n'y saisisse de données.
#  Le retrait de l'authentification est une décision à prendre plus tard,
#  explicitement, et pas un oubli de configuration.
#
#  À ADAPTER AVANT MISE EN SERVICE : les trois lignes marquées « ⚠ ».
# =====================================================================

# Zone de limitation de débit pour la connexion. À placer dans le bloc
# « http » si votre configuration éclate les fichiers autrement.
limit_req_zone $binary_remote_addr zone=connexion:10m rate=10r/m;

# ---------------------------------------------------------------- HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name prevention.example.fr;          # ⚠ nom d'hôte à renseigner

    # Laisser passer uniquement la validation Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        auth_basic off;
    }
    location / { return 301 https://$host$request_uri; }
}

# ------------------------------------------------------------------- HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prevention.example.fr;          # ⚠ nom d'hôte à renseigner

    ssl_certificate     /etc/ssl/certs/prevention.crt;   # ⚠ certificat AZNETWORK
    ssl_certificate_key /etc/ssl/private/prevention.key; # ⚠ clé privée
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root  /var/www/prevention-sante;
    index index.html;
    charset utf-8;

    # ------------------------------------------------------ API
    # Placé AVANT les autres locations : l'API doit être relayée, jamais
    # cherchée parmi les fichiers.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # L'adresse réelle du visiteur. Sans cela, la limitation des
        # tentatives de connexion verrait toutes les requêtes venir de
        # 127.0.0.1 et bloquerait tout le monde d'un coup.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aucune réponse d'API en cache, à aucun niveau.
        proxy_cache off;
        add_header Cache-Control "no-store" always;

        # Un questionnaire complet peut peser : on laisse de la marge, mais
        # pas au point d'accepter n'importe quoi.
        client_max_body_size 2m;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # L'API porte sa propre authentification par session : le mot de
        # passe d'accès à la maquette ne s'y applique pas, sinon les
        # comptes patients seraient inutilisables.
        auth_basic off;
    }

    # Le second facteur et la connexion méritent une limite de débit
    # propre : elles sont la porte d'entrée, et la limitation applicative
    # ne protège pas du coût des requêtes elles-mêmes.
    location = /api/connexion {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        auth_basic off;
    }

    # ------------------------------------------------------ accès restreint
    # Pendant la phase pilote, les PAGES restent derrière un mot de passe.
    # L'API, elle, en est exemptée (voir location /api/) : elle a sa propre
    # authentification, et un double mot de passe rendrait les comptes
    # patients inutilisables.
    #
    #   htpasswd -c /etc/nginx/.htpasswd-prevention devsante
    #
    # À RETIRER le jour de l'ouverture au public — décision explicite, pas
    # un oubli de configuration.
    auth_basic           "Accès réservé — phase pilote";
    auth_basic_user_file /etc/nginx/.htpasswd-prevention;

    # Restriction par adresse IP, en complément ou en remplacement.
    # Décommenter et renseigner les adresses du groupe :
    # allow 203.0.113.0/24;
    # deny  all;

    # ------------------------------------------------------ non indexable
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # ------------------------------------------------------ en-têtes de sécurité
    add_header X-Content-Type-Options "nosniff"            always;
    add_header X-Frame-Options        "DENY"               always;
    add_header Referrer-Policy        "no-referrer"         always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"    always;

    # Politique de sécurité du contenu.
    #
    # 'unsafe-inline' est nécessaire : les sept pages portent leur CSS et leur
    # JavaScript en ligne, par conception (aucune dépendance, aucun script
    # tiers, rien à charger depuis un CDN). C'est un compromis assumé et à
    # durcir avec des nonces quand le socle applicatif sera construit.
    #
    # images.unsplash.com : sept photographies de la seule page publique.
    # À supprimer de cette ligne dès que les fichiers seront hébergés en
    # propre — voir la section « Photographies » du README du projet. Le
    # site n'aura alors plus aucune sortie réseau.
    # « form-action 'self' » et non 'none' : les pages soumettent
    # maintenant des formulaires à l'API. 'none' les bloquerait.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # ------------------------------------------------------ fichiers à ne pas servir
    # verifier.js est un outil de contrôle interne, chargé par aucune page ;
    # il décrirait publiquement toute la logique de vérification. Le script de
    # déploiement l'exclut déjà : cette règle est une seconde barrière.
    location = /plateforme/verifier.js { deny all; return 404; }
    location = /README.md              { deny all; return 404; }
    location = /.version               { deny all; return 404; }
    location ~ /\.(git|env|ht)         { deny all; return 404; }

    # ------------------------------------------------------ cache
    # Les pages HTML ne sont jamais mises en cache : elles portent les jetons
    # de version (?v=N) des scripts, et un HTML en cache servirait d'anciens
    # scripts. Les fichiers versionnés, eux, se mettent en cache longuement.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }
    location ~* \.(js|css|svg|jpg|jpeg|png|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ------------------------------------------------------ divers
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Aucune route dynamique : si le fichier n'existe pas, c'est une 404.
    # Ne PAS ajouter de try_files vers index.html : le site n'est pas une
    # application à route unique, et masquer les 404 cacherait un déploiement
    # incomplet.
    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/prevention-access.log;
    error_log  /var/log/nginx/prevention-error.log warn;
}
